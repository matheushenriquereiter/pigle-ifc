<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>User Articles</title>
</head>
<body>

<h1>User Articles</h1>
<p th:each="article : ${userArticles}" th:object="${article}">
    <span th:text="*{id}"></span>
    <span th:text="*{title}"></span>
    <span th:text="*{resume}"></span>
</p>

</body>
</html>
